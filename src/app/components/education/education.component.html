<section id="education" class="py-12 bg-gray-100">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-3xl font-bold text-center mb-8">Education</h2>
      
      <div class="space-y-6">
        <div *ngFor="let edu of education" class="bg-white p-6 rounded-lg shadow-sm">
          <h3 class="text-xl font-semibold">{{ edu.institution }}</h3>
          <p class="text-gray-600">{{ edu.period }}</p>
          <p class="mt-2">{{ edu.degree }}</p>
          <p *ngIf="edu.grade" class="mt-2 font-medium">Grade: {{ edu.grade }}</p>
        </div>
      </div>
    </div>
  </section>
